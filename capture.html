<!DOCTYPE html>
<html>
<head>
    <title>Capturing Live Location...</title>
    <script>
        function getGPSAndRedirect() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    var gpsString = lat + ", " + lon;

                    // This grabs whatever ?room= text you put in your browser link
                    var urlParams = new URLSearchParams(window.location.search);
                    var roomParam = urlParams.get('room') || "";

                    // YOUR CUSTOM GOOGLE FORM CONFIGURATION
                    var formBase = "https://docs.google.com/forms/d/e/1FAIpQLSdvAk8eD2D-UT2Gsi9sZZo2DGuqIFxhGqeSKeAqijbnm3950A/viewform";
                    var gpsEntry = "entry.1324484530";
                    var roomEntry = "entry.785910206";

                    // Stitches the satellite telemetry data into the pre-filled form URL
                    var finalUrl = formBase + "?" + gpsEntry + "=" + encodeURIComponent(gpsString) + "&" + roomEntry + "=" + encodeURIComponent(roomParam);
                    
                    window.location.href = finalUrl;
                }, function(error) {
                    alert("GPS Access Denied. Please ensure location permissions are enabled for this site in your phone's browser.");
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }
        window.onload = getGPSAndRedirect;
    </script>
</head>
<body>
    <p style="text-align: center; font-family: sans-serif; margin-top: 50px; color: #555; font-size: 14px;">
        Securing satellite tracking connection... Opening your Form.
    </p>
</body>
</html>
