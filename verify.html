<!DOCTYPE html>
<html>
<head>
    <title>Equipment Location Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #f4f6f9; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #7044a0; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h2>Verifying Device GPS...</h2>
    <p>Please select "Allow" when your browser requests location data.</p>
    <div class="spinner"></div>

    <script>
    // 1. Automatically grab the dynamic details out of the QR link text
    const urlParams = new URLSearchParams(window.location.search);
    const assetId = urlParams.get('id') || "Unknown-Asset";
    const roomNo = urlParams.get('room') || "Unknown-Room";

    // 2. Wake up the phone's hardware GPS chip
    navigator.geolocation.getCurrentPosition(function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        
        // Your live master form URL
        var masterForm = "https://docs.google.com/forms/d/e/1FAIpQLScJ4r7nb66sG_SNmQvt8HmB3yjojqsKrsQGURWRbC8sp59JZQ/viewform";
        
        // 3. Construct the dynamic link with your verified Form IDs
        var redirectUrl = masterForm + "?usp=pp_url" +
                          "&entry.402534399=" + encodeURIComponent(assetId) + 
                          "&entry.2014597673=" + encodeURIComponent(roomNo) + 
                          "&entry.242083018=" + lat + 
                          "&entry.678694953=" + lon;
        
        // 4. Open the form as a response instantly
        window.location.href = redirectUrl;
    }, function(error) {
        alert("Location access is mandatory for compliance tracking. Please refresh and allow access.");
    }, {
        enableHighAccuracy: true,
        timeout: 10000
    });
    </script>

</body>
</html>
